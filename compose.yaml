services:
  db:
    image: postgres:16-alpine
    container_name: academy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-academy}
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DataBase/Database.sql:/docker-entrypoint-initdb.d/001-database.sql:ro
      - ./DataBase/seeds:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-academy} -d ${POSTGRES_DB:-academy}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: .
    container_name: academy-api
    restart: unless-stopped
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-academy}
      PGUSER: ${POSTGRES_USER:-academy}
      PGPASSWORD: ${POSTGRES_PASSWORD:-academy_local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./media:/app/media:ro
      - ./DataBase/seeds:/app/DataBase/seeds:ro
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    container_name: academy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    environment:
      CADDY_HOSTS: ${CADDY_HOSTS:-localhost}
      CADDY_DEFAULT_SNI: ${CADDY_DEFAULT_SNI:-localhost}

volumes:
  postgres_data:
  # Guarda autoridad certificadora en local
  caddy_data:
  caddy_config:
