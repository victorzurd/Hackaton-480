<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6f3" />
    <meta name="description" content="Accede a tu espacio de aprendizaje de 480 Academy." />
    <title>Cursos · 480 Academy</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/dist/app.js"></script>
  </head>
  <body data-page="cursos">
    <header class="topbar">
      <div class="topbar__inner">
        <a class="wordmark" href="/" aria-label="480 Academy, inicio">
          <span class="wordmark__mark" aria-hidden="true"><span>4</span>80</span>
          <span class="wordmark__academy">Academy</span>
        </a>
      </div>
    </header>
    <main class="page-main">
      <div class="auth-shell">
        <section class="auth-panel" aria-labelledby="dashboard-title">
          <section id="success-view" class="dashboard-view" aria-labelledby="dashboard-title" hidden>
            <header class="dashboard-heading">
              <div>
                <p class="section-kicker">TU ESPACIO DE APRENDIZAJE</p>
                <h2 id="dashboard-title">Hola.</h2>
                <p id="dashboard-copy" class="dashboard-heading__copy">
                  Explora cursos y continúa con los que ya has empezado.
                </p>
              </div>
              <button class="button button--secondary dashboard-logout" type="button" id="logout-button">
                Cerrar sesión
              </button>
            </header>
            <div class="course-tabs" role="tablist" aria-label="Secciones de cursos">
              <button
                class="course-tab is-active"
                id="tab-available"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="course-panel"
                data-course-tab="available"
              >
                Cursos disponibles
              </button>
              <button
                class="course-tab"
                id="tab-enrolled"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="course-panel"
                tabindex="-1"
                data-course-tab="enrolled"
              >
                Mis cursos
              </button>
            </div>
            <section id="course-panel" class="course-panel" role="tabpanel" aria-labelledby="tab-available" tabindex="0">
              <div class="course-panel__heading">
                <div>
                  <h3 id="course-section-title">Encuentra tu próximo curso.</h3>
                  <p id="course-section-copy">Busca en el catálogo por título o descripción.</p>
                </div>
                <label class="course-search">
                  <span class="sr-only">Filtrar cursos por título o descripción</span>
                  <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                    <circle cx="10.8" cy="10.8" r="6.8"></circle>
                    <path d="m16 16 4.5 4.5"></path>
                  </svg>
                  <input
                    id="course-search"
                    type="search"
                    maxlength="100"
                    placeholder="Buscar cursos"
                    autocomplete="off"
                  />
                </label>
              </div>
              <p id="course-status" class="course-status" role="status" aria-live="polite"></p>
              <div id="course-list" class="course-grid" aria-busy="false"></div>
            </section>
          </section>
        </section>
      </div>
    </main>
    <footer class="page-footer">
      <span>480 Academy</span>
      <span>Aprende a tu ritmo.</span>
    </footer>
  </body>
</html>
